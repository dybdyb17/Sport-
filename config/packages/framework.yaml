# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Locale française par défaut (filtres date, validators, IntlDateFormatter, etc.)
    default_locale: fr

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    # ── Trusted proxies (Railway termine le TLS en amont) ────────────────
    # Sans ça, Symfony reçoit les requêtes en http en interne et génère
    # toutes les URL absolues (sitemap, mails CLI désactivés mais routes
    # absolues dans les pages, etc.) en http → Google Search Console
    # rejette le sitemap car les <loc> ne matchent pas le https déclaré.
    # REMOTE_ADDR + plages privées RFC1918 = compromis sûr pour Railway
    # (IP de proxy non fixe, on fait confiance au dernier hop quel qu'il
    # soit). x-forwarded-proto donne le bon scheme côté Symfony.
    trusted_proxies: '%env(TRUSTED_PROXIES)%'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-host', 'x-forwarded-proto', 'x-forwarded-port']

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
