security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    # Un coach et un admin ont aussi les droits d'un client/utilisateur connecté.
    role_hierarchy:
        ROLE_COACH: [ROLE_CLIENT, ROLE_USER]
        ROLE_ADMIN: [ROLE_COACH, ROLE_CLIENT, ROLE_USER]

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                success_handler: App\Security\LoginRedirectHandler
            logout:
                path: app_logout
                target: app_home
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /

    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/register, roles: PUBLIC_ACCESS }
        # Mot de passe oublié : demande + reset protégés par lien signé HMAC à usage unique
        - { path: ^/mot-de-passe-oublie, roles: PUBLIC_ACCESS }
        - { path: ^/reinitialiser-mot-de-passe, roles: PUBLIC_ACCESS }
        # Confirmation J-1 accessible sans auth : protégée par lien signé HMAC
        - { path: ^/reservation/[^/]+/confirmer/, roles: PUBLIC_ACCESS }
        - { path: ^/coach(/|$), roles: ROLE_COACH }
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/reservation, roles: ROLE_CLIENT }

when@test:
    security:
        password_hashers:
            # Hash plus rapide pour accélérer la suite de tests.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
